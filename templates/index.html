<!DOCTYPE html>
<html>
<head>
    <title>S3 Transfer Tool</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light p-4">

    <div class="container mt-5">
        <h2 class="mb-4">AWS S3 File Transfer</h2>

        <div class="card shadow p-4">
            <div class="mb-3">
                <label class="form-label">Source Bucket</label>
                <input type="text" id="sourceBucket" class="form-control" placeholder="example-source-bucket">
            </div>

            <div class="mb-3">
                <label class="form-label">Destination Bucket</label>
                <input type="text" id="destBucket" class="form-control" placeholder="example-dest-bucket">
            </div>

            <div class="mb-3">
                <label class="form-label">File Key / Path</label>
                <input type="text" id="fileKey" class="form-control" placeholder="folder/file.txt">
            </div>

            <button class="btn btn-primary" onclick="startTransfer()">Transfer File</button>
        </div>

        <div class="mt-4">
            <div id="status" class="alert d-none"></div>
        </div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
